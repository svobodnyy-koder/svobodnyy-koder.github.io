<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partes do Cavalo e Material</title>
<style>
:root{
  --bg:#EFE7D6; --surface:#FBF6EA; --surface2:#F4ECDA;
  --ink:#2A2019; --muted:#71614D; --line:#DBCDB1;
  --couro:#7A5230; --couro2:#9A6B3D; --latao:#B07D24; --latao2:#caa04a;
  --navy:#233C4A; --ok:#3E7A44; --okbg:#E4EFDD; --err:#B23A2E; --errbg:#F4E0DC;
  --mk:#F5601A; --mk2:#ff7a2e;
  --shadow:0 1px 2px rgba(42,32,25,.08),0 8px 24px -12px rgba(42,32,25,.28);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#191410; --surface:#241D16; --surface2:#2B231A;
    --ink:#EFE3CD; --muted:#A8977C; --line:#3B3123;
    --couro:#B27C46; --couro2:#C79459; --latao:#D2A24C; --latao2:#E4BD6D;
    --navy:#79AEBE; --ok:#77BE77; --okbg:#20301F; --err:#E27D68; --errbg:#3A211C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#191410; --surface:#241D16; --surface2:#2B231A;
  --ink:#EFE3CD; --muted:#A8977C; --line:#3B3123;
  --couro:#B27C46; --couro2:#C79459; --latao:#D2A24C; --latao2:#E4BD6D;
  --navy:#79AEBE; --ok:#77BE77; --okbg:#20301F; --err:#E27D68; --errbg:#3A211C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#EFE7D6; --surface:#FBF6EA; --surface2:#F4ECDA;
  --ink:#2A2019; --muted:#71614D; --line:#DBCDB1;
  --couro:#7A5230; --couro2:#9A6B3D; --latao:#B07D24; --latao2:#caa04a;
  --navy:#233C4A; --ok:#3E7A44; --okbg:#E4EFDD; --err:#B23A2E; --errbg:#F4E0DC;
  --mk:#F5601A; --mk2:#ff7a2e;
  --shadow:0 1px 2px rgba(42,32,25,.08),0 8px 24px -12px rgba(42,32,25,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(122,82,48,.05) 1px,transparent 1px);
  background-size:22px 22px;}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 64px}

/* Header */
header{display:flex;align-items:center;gap:14px;padding:8px 0 16px;border-bottom:2px solid var(--line);position:relative}
.crest{flex:none;display:flex;align-items:center}
.crest img{height:54px;width:auto;display:block;filter:drop-shadow(0 1px 3px rgba(0,0,0,.3))}
.brand h1{font-family:var(--serif);font-size:19px;margin:0;letter-spacing:.2px;font-weight:600}
.brand p{margin:0;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.spacer{flex:1}
.iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);width:40px;height:40px;
  border-radius:10px;cursor:pointer;font-size:17px;display:grid;place-items:center;box-shadow:var(--shadow)}
.iconbtn:hover{border-color:var(--latao)}

/* Tabs */
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 14px}
.tab{font-family:var(--serif);font-size:15px;padding:8px 15px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);cursor:pointer;transition:.12s}
.tab:hover{color:var(--ink);border-color:var(--couro)}
.tab[aria-selected="true"]{background:var(--couro);color:#fff;border-color:var(--couro);box-shadow:var(--shadow)}
:root[data-theme="dark"] .tab[aria-selected="true"], @media(prefers-color-scheme:dark){}

/* Mode + score bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.modes{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.mode{border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:7px;cursor:pointer;
  font-size:13.5px;font-weight:600;font-family:var(--sans)}
.mode[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ficha{margin-left:auto;display:inline-flex;align-items:center;gap:14px;font-size:13px;color:var(--muted)}
.ficha b{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.ficha .ok{color:var(--ok)} .ficha .er{color:var(--err)}
.reset{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline;padding:2px}

/* Panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:16px;position:relative;overflow:hidden}
.panel::before,.panel::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--latao);opacity:.5}
.panel::before{top:8px;left:8px;border-right:0;border-bottom:0;border-top-left-radius:5px}
.panel::after{bottom:8px;right:8px;border-left:0;border-top:0;border-bottom-right-radius:5px}

.prompt{text-align:center;min-height:30px;margin:2px 0 8px;font-size:15px;color:var(--muted)}
.prompt b{color:var(--ink);font-family:var(--serif);font-size:22px;font-weight:600}
.prompt .tag{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--latao);
  border:1px solid var(--latao);padding:1px 8px;border-radius:20px;vertical-align:middle;margin-left:6px}

.stage{display:grid;grid-template-columns:1fr;gap:14px}
.svgbox{position:relative;width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  display:flex;justify-content:center;padding:6px}
svg.diagram{display:block;max-width:100%;max-height:64vh;height:auto;width:auto;margin:0 auto;touch-action:manipulation;border-radius:8px}

/* 3D viewer */
.h3dbox{width:100%;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;min-height:300px}
.h3d-overlay{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.h3d-mk{position:absolute;left:0;top:0;pointer-events:auto;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:var(--mk);color:#fff;font:600 12px var(--sans);cursor:pointer;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.45);transition:opacity .15s,background .15s}
.h3d-mk:hover{background:var(--couro)}
.h3d-mk.occ{opacity:.18}
.h3d-mk.named{width:auto;height:auto;padding:3px 9px;border-radius:20px}
.h3d-mk.pulse{background:var(--navy);box-shadow:0 0 0 5px rgba(35,60,74,.28)}
.h3d-mk.good{background:var(--ok)}.h3d-mk.bad{background:var(--err)}.h3d-mk.dim{opacity:.22}
.h3d-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.h3d-name{text-align:center;min-height:28px;font-family:var(--serif);font-size:20px;color:var(--couro);font-weight:600;margin:6px 0}
.h3d-hint{text-align:center;font-size:12.5px;color:var(--muted);margin-top:8px}
.h3d-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}

/* hotspots */
.hs{cursor:pointer}
.hs .dot{r:var(--r,10);fill:var(--mk);stroke:#fff;stroke-width:calc(var(--r,10)*0.18);transition:fill .12s,r .12s}
.hs .num{fill:#fff;font-weight:700;font-size:var(--nf,11px);font-family:var(--sans);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hs:hover .dot,.hs.hot .dot{fill:var(--couro);r:calc(var(--r,10)*1.12)}
.hs.pulse .dot{fill:var(--navy);r:calc(var(--r,10)*1.18)}
.hs.pulse .ring{animation:pulse 1.4s ease-out infinite}
.hs .ring{r:var(--r,10);fill:none;stroke:var(--navy);stroke-width:calc(var(--r,10)*0.14);opacity:0}
@keyframes pulse{0%{r:var(--r,10);opacity:.9}100%{r:calc(var(--r,10)*2.6);opacity:0}}
.hs.good .dot{fill:var(--ok)} .hs.bad .dot{fill:var(--err)}
.hs.dim{opacity:.32}
@media (prefers-reduced-motion:reduce){.hs.pulse .ring{animation:none;opacity:.5}}

/* legend */
.legend{list-style:none;margin:0;padding:0;columns:2;column-gap:14px;font-size:13.5px}
@media(max-width:560px){.legend{columns:1}}
.legend li{break-inside:avoid;display:flex;gap:8px;align-items:baseline;padding:3px 6px;border-radius:6px;cursor:default}
.legend li .n{font:600 11px var(--mono);color:#fff;background:var(--couro);min-width:20px;height:20px;border-radius:50%;
  display:inline-grid;place-items:center;flex:none}
.legend li.hot{background:var(--surface2)} .legend li.hot .n{background:var(--latao)}
.legend li span.nm{color:var(--ink)}

/* choices */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
@media(max-width:560px){.choices{grid-template-columns:1fr}}
.choice{font-family:var(--serif);font-size:16px;text-align:left;padding:13px 16px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface2);color:var(--ink);cursor:pointer;transition:.12s}
.choice:hover:not(:disabled){border-color:var(--couro);transform:translateY(-1px)}
.choice:disabled{cursor:default}
.choice.correct{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.choice.wrong{background:var(--errbg);border-color:var(--err);color:var(--err)}

/* type input */
.typerow{display:flex;gap:8px;margin-top:6px;justify-content:center;flex-wrap:wrap}
.typerow input{font-family:var(--serif);font-size:17px;padding:11px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface2);color:var(--ink);min-width:260px}
.typerow input:focus{outline:2px solid var(--latao);outline-offset:1px;border-color:var(--latao)}
.btn{font-family:var(--sans);font-weight:600;font-size:14px;padding:11px 20px;border-radius:11px;border:0;cursor:pointer;
  background:var(--couro);color:#fff;box-shadow:var(--shadow)}
.btn:hover{background:var(--couro2)}
.btn.ghost{background:transparent;color:var(--couro);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--couro);background:var(--surface2)}

.feedback{text-align:center;min-height:26px;font-size:15px;font-weight:600;margin-top:4px}
.feedback.ok{color:var(--ok)} .feedback.er{color:var(--err)}
.controls{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}

/* toggle for name-mode input style */
.toggle{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;font-size:12.5px}
.toggle button{border:0;background:transparent;color:var(--muted);padding:5px 11px;border-radius:6px;cursor:pointer;font-weight:600}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* materiais / flashcards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px;font-family:var(--serif);font-size:17px;color:var(--couro)}
.card p{margin:0;font-size:13.5px;color:var(--muted)}

/* exam / prova */
.setup{max-width:560px;margin:6px auto;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.checkrow{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px;cursor:pointer}
.chk em{color:var(--muted);font-style:normal;font-size:12px;font-family:var(--mono)}
.chk input{accent-color:var(--couro);width:16px;height:16px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--couro);color:#fff}
.note{margin:0;font-size:12.5px;color:var(--muted)}
.btn.start{align-self:flex-start;font-size:15px;padding:12px 22px}
.qtop{display:flex;align-items:center;gap:14px}
.prog{flex:1;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.pbar{height:6px;background:var(--surface2);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--latao);border-radius:20px;transition:width .3s}
.clock{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.clock b{color:var(--ink);font-family:var(--mono)}
.clock.lim b{color:var(--latao)}
.stim.card{max-width:520px;margin:0 auto;text-align:center}
.stim.card h3{font-family:var(--serif);color:var(--couro);font-size:22px;margin:4px 0}
.stim.card p{font-size:16px;color:var(--ink);margin:0}
.textarea{width:100%;font-family:var(--serif);font-size:16px;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);resize:vertical;margin-top:4px}
.textarea:focus{outline:2px solid var(--latao);outline-offset:1px;border-color:var(--latao)}
.gabarito{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--latao);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:15px;line-height:1.5}
.gabarito .glabel{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--latao);margin-bottom:4px}
.gabarito strong{color:var(--couro)}
.selfq{text-align:center;color:var(--muted);font-size:13.5px;margin:14px 0 6px}
.selfgrade{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sg{border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-weight:600;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:14px}
.sg.ok:hover,.sg.ok.chosen{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.sg.partial:hover,.sg.partial.chosen{background:var(--surface);border-color:var(--latao);color:var(--latao)}
.sg.err:hover,.sg.err.chosen{background:var(--errbg);border-color:var(--err);color:var(--err)}
.sg:disabled{opacity:.55;cursor:default}
.results{max-width:600px;margin:0 auto}
.scorecard{display:flex;align-items:center;gap:22px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:8px 0 16px;flex-wrap:wrap;justify-content:center}
.nota{display:flex;align-items:baseline;gap:4px}
.nota .big{font-family:var(--serif);font-size:52px;font-weight:700;color:var(--couro);line-height:1}
.nota .of{color:var(--muted);font-size:16px}
.rmeta{display:flex;gap:22px}
.rmeta>div{display:flex;flex-direction:column}
.rmeta b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.rmeta span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.review{list-style:none;margin:0;padding:0;columns:2;column-gap:14px}
@media(max-width:560px){.review{columns:1}.rmeta{gap:14px}}
.rv{break-inside:avoid;display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;font-size:13.5px}
.rv .rvn{font:600 11px var(--mono);color:var(--muted);min-width:20px}
.rv .rvm{font-weight:700;width:16px;text-align:center}
.rv.ok .rvm{color:var(--ok)}.rv.err .rvm{color:var(--err)}.rv.partial .rvm{color:var(--latao)}
.rv .rvt{color:var(--ink)}
.hint{text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px}
.footnote{text-align:center;font-size:11.5px;color:var(--muted);margin-top:26px;letter-spacing:.03em}
.credit{text-align:center;font-size:13px;color:var(--ink);margin-top:26px;letter-spacing:.02em}
.credit b{color:var(--couro)} .credit span{font-size:16px;vertical-align:-2px}
kbd{font-family:var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crest">
      <img src="brasao.webp" alt="Academia Barro Branco — APMBB">
    </div>
    <div class="brand">
      <h1>Partes do Cavalo &amp; Material de Montaria</h1>
      <p>Policiamento Montado · APMBB</p>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="theme" title="Alternar tema" aria-label="Alternar tema">◑</button>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Categorias"></nav>

  <div class="bar">
    <div class="modes" id="modes" role="tablist" aria-label="Modo de estudo"></div>
    <div class="ficha">
      <span id="modehint"></span>
      <span>Acertos <b class="ok" id="sOk">0</b></span>
      <span>Erros <b class="er" id="sEr">0</b></span>
      <button class="reset" id="reset">zerar</button>
    </div>
  </div>

  <div class="panel">
    <div id="app"></div>
  </div>

  <p class="credit">Desenvolvido por <b>Igor</b> <span aria-label="Brasil">🇧🇷</span> <span aria-label="Rússia">🇷🇺</span></p>
</div>

<!--THREE_LIBS-->
<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="three-horse.js"></script>
<!--/THREE_LIBS-->

<script>
window.ENABLE_3D=true;
const HORSE_MODEL_URL="models/Horse_opt.glb";/*MODEL_URL*/

 "Canela (posterior)":"Osso canela do membro posterior (metatarso).",
 "Boleto (posterior)":"Articulação do boleto no membro posterior.",
 "Quartela (posterior)":"Segmento entre o boleto e o casco (posterior).",
 "Casco (posterior)":"Estojo córneo do pé posterior.",
 "Assento (fundo da sela)":"Parte central da sela onde o cavaleiro se senta.",
 "Patilha":"Parte traseira elevada da sela (arção traseiro).",
 "Cepilho":"Reforço/parte na região dianteira da sela, junto ao assento.",
 "Sobre aba":"Aba superior da sela, que fica por cima da aba.",
 "Borraina":"Bloco dianteiro da aba que apoia o joelho do cavaleiro.",
 "Aba":"Aba lateral da sela que recobre os suadouros e a cilha.",
 "Suadouros":"Abas internas de couro em contato com o suor do cavalo.",
 "Cilha":"Correia que passa sob o ventre e prende a sela (barrigueira).",
 "Loro":"Correia que sustenta o estribo.",
 "Estribo":"Peça metálica onde o cavaleiro apoia o pé.",
 "Soleira do estribo":"Base do estribo onde apoia a sola do pé.",
 "Cachaceira":"Correia que passa atrás das orelhas/nuca, sustentando a cabeçada.",
 "Testeira":"Correia que passa na fronte, à frente das orelhas.",
 "Faceira":"Correia lateral que desce pela face até a embocadura.",
 "Fucinheira":"Correia que envolve o focinho/nariz.",
 "Cisgola (Afogador)":"Correia sob a ganacha/garganta, evita a cabeçada de sair.",
 "Embocadura (bridão)":"Peça metálica (freio/bridão) colocada na boca do cavalo.",
 "Rédea":"Tira presa à embocadura pela qual o cavaleiro conduz o cavalo."
};

const CATS={
  cavalo:{label:"Partes do Cavalo",parts:cavaloParts,vb:CAVALO_VB,draw:drawCavalo},
  sela:{label:"Sela",parts:selaParts,vb:SELA_VB,draw:drawSela},
  bridao:{label:"Cabeçada de Bridão",parts:bridaoParts,vb:BRIDAO_VB,draw:drawBridao},
  materiais:{label:"Materiais",materiais:true},

};

/* ---------- SVG ART ---------- */
function imgDiagram(vb,src,alt){
 const [,,w,h]=vb;
 return `<svg class="diagram" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${alt}">`+
   `<image href="${src}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet"/></svg>`;
}
function drawCavalo(){return imgDiagram(CAVALO_VB,IMG.cavalo,"Figura anatômica do cavalo");}
function drawSela(){return imgDiagram(SELA_VB,IMG.sela,"Foto da sela inglesa");}
function drawBridao(){return imgDiagram(BRIDAO_VB,IMG.bridao,"Cabeça com cabeçada de bridão");}

/* ---------- STATE ---------- */
const state={cat:"cavalo",mode:"estudar",nameStyle:"choice",q:null,answered:false};
const score={ok:0,er:0};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
   .replace(/["'()]/g,"").replace(/\b(anterior|posterior|afogador|rabo|vazio|crineira)\b/g,"").replace(/[^a-z ]/g,"").trim();
const disp=p=>p.short||p.n;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- RENDER SHELL ---------- */
const app=document.getElementById("app");
function buildTabs(){
 const t=document.getElementById("tabs");
 t.innerHTML=Object.entries(CATS).map(([k,v])=>
   `<button class="tab" role="tab" data-cat="${k}" aria-selected="${k===state.cat}">${v.label}</button>`).join("");
 t.onclick=e=>{const b=e.target.closest(".tab");if(!b)return;
   clearExamTimer();
   if(b.dataset.cat==="prova"&&state.cat!=="prova")exam=null;
   state.cat=b.dataset.cat;
   if(state.cat==="materiais"&&!["estudar"].includes(state.mode))state.mode="estudar";
   syncTabs();render();};
}
function syncTabs(){
 document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.cat===state.cat));
 buildModes();
}
function buildModes(){
 const m=document.getElementById("modes");
 document.querySelector(".ficha").style.display = state.cat==="prova"?"none":"";
 if(state.cat==="prova"){m.style.display="none";m.innerHTML="";document.getElementById("modehint").textContent="";return;}
 m.style.display="";
 let modes;
 if(state.cat==="materiais") modes=[["estudar","Estudar"],["quiz","Quiz"]];
 else if(state.cat==="cavalo"&&window.ENABLE_3D) modes=[["tri","Estudar 3D ✦"],["apontar","Apontar"],["nomear","Nomear"]];
 else modes=[["estudar","Estudar"],["apontar","Apontar"],["nomear","Nomear"]];
 if(!modes.find(x=>x[0]===state.mode))state.mode=modes[0][0];
 m.innerHTML=modes.map(([k,l])=>`<button class="mode" data-mode="${k}" role="tab" aria-selected="${k===state.mode}">${l}</button>`).join("");
 m.onclick=e=>{const b=e.target.closest(".mode");if(!b)return;state.mode=b.dataset.mode;
   document.querySelectorAll(".mode").forEach(x=>x.setAttribute("aria-selected",x.dataset.mode===state.mode));render();};
 const hints={estudar:"Explore o diagrama e a legenda",apontar:"Clique no ponto certo do diagrama",
   nomear:"Identifique o ponto destacado",quiz:"Descrição → nome do material"};
 document.getElementById("modehint").textContent="";
}

/* ---------- RENDER MODES ---------- */
function render(){
 syncScore();
 if(!(state.cat==="cavalo"&&state.mode==="tri")&&window.Horse3D&&Horse3D.isReady) Horse3D.dispose();
 if(state.cat==="prova")return renderProva();
 if(state.cat==="materiais"){return state.mode==="quiz"?renderMatQuiz():renderMateriais();}
 const c=CATS[state.cat];
 if(state.mode==="tri")return renderTri(c);
 if(state.mode==="estudar")return renderEstudar(c);
 if(state.mode==="apontar")return renderApontar(c);
 if(state.mode==="nomear")return renderNomear(c);
}
function renderTri(c){
 app.innerHTML=`

 Horse3D.init(box,{model:HORSE_MODEL_URL, onPick, onError:()=>{box.innerHTML='<div class="h3d-load">Não foi possível carregar o modelo 3D. Verifique a conexão.</div>';}});

 document.getElementById("resetv").onclick=()=>Horse3D.resetView();
 function applyTri(){

 function nextTestar(){

function markerSize(vb){const R=Math.max(11,Math.round(vb[3]/52));return {R,nf:Math.round(R*0.92)};}
function hotspotsSVG(c,{numbers=false,active=null}={}){
 const {R,nf}=markerSize(c.vb);
 return c.parts.map((p,i)=>{
   const cls="hs"+(active===i?" pulse":"");
   return `<g class="${cls}" data-i="${i}" tabindex="0" role="button" aria-label="ponto ${i+1}" style="--r:${R}px;--nf:${nf}px">
     <circle class="ring" cx="${p.x}" cy="${p.y}" r="${R}"/>
     <circle class="dot" cx="${p.x}" cy="${p.y}" r="${R}"/>
     ${numbers?`<text class="num" x="${p.x}" y="${p.y}">${i+1}</text>`:""}
   </g>`;
 }).join("");
}

/* ESTUDAR */
function renderEstudar(c){
 const legend=c.parts.map((p,i)=>
   `<li data-i="${i}"><span class="n">${i+1}</span><span class="nm">${p.n}</span></li>`).join("");
 app.innerHTML=`
  <div class="prompt"><b>${c.label}</b><span class="tag">${c.parts.length} pontos</span></div>
  <div class="stage">
    <div class="svgbox">${c.draw()}<g></g></div>
    <ol class="legend">${legend}</ol>
  </div>
  <p class="hint">Passe o mouse (ou toque) sobre um número ou um ponto para destacá-lo.</p>`;
 injectHotspots(c,{numbers:true});
 // link legend <-> dots
 const dots=[...app.querySelectorAll(".hs")], lis=[...app.querySelectorAll(".legend li")];
 function hl(i,on){dots[i]&&dots[i].classList.toggle("hot",on);lis[i]&&lis[i].classList.toggle("hot",on);}
 dots.forEach((d,i)=>{d.onmouseenter=()=>hl(i,true);d.onmouseleave=()=>hl(i,false);
   d.onclick=()=>{lis[i].scrollIntoView({block:"nearest",behavior:"smooth"});flash(i,dots,lis);};d.onfocus=()=>hl(i,true);d.onblur=()=>hl(i,false);});
 lis.forEach((l,i)=>{l.onmouseenter=()=>hl(i,true);l.onmouseleave=()=>hl(i,false);});
}
function flash(i,dots,lis){lis[i].classList.add("hot");dots[i].classList.add("hot");setTimeout(()=>{lis[i].classList.remove("hot");dots[i].classList.remove("hot");},700);}

/* APONTAR: given a name, click the spot */
function renderApontar(c){
 if(use3DHorse(state.cat)) return renderApontar3D();
 const idx=Math.floor(Math.random()*c.parts.length);
 const target=c.parts[idx];
 // all indices sharing same display name are acceptable
 const accept=c.parts.map((p,i)=>disp(p)===disp(target)?i:-1).filter(i=>i>=0);
 state.q={idx,accept};state.answered=false;
 app.innerHTML=`
  <div class="prompt">Onde fica: <b>${target.n}</b>?</div>
  <div class="stage"><div class="svgbox">${c.draw()}</div></div>
  <div class="feedback" id="fb">&nbsp;</div>
  <div class="controls"><button class="btn ghost" id="skip">Mostrar resposta</button><button class="btn" id="next" style="display:none">Próximo →</button></div>`;
 injectHotspots(c,{});
 const dots=[...app.querySelectorAll(".hs")];
 dots.forEach((d,i)=>{d.onclick=()=>answerApontar(i,dots,c);
   d.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();answerApontar(i,dots,c);}};});
 document.getElementById("skip").onclick=()=>{if(state.answered)return;revealApontar(dots,c,false);};
 document.getElementById("next").onclick=()=>renderApontar(c);
}
function answerApontar(i,dots,c){
 if(state.answered)return;
 const ok=state.q.accept.includes(i);
 state.answered=true;
 if(ok){dots[i].classList.add("good");score.ok++;fb(true,"Correto!");}
 else{dots[i].classList.add("bad");state.q.accept.forEach(k=>dots[k].classList.add("good"));score.er++;
   fb(false,"Esse é: "+c.parts[i].n+". Correto em destaque.");}
 dots.forEach((d,k)=>{if(!d.classList.contains("good")&&!d.classList.contains("bad"))d.classList.add("dim");d.onclick=null;});
 syncScore();finishBtns();
}
function revealApontar(dots,c){
 state.answered=true;score.er++;
 state.q.accept.forEach(k=>dots[k].classList.add("good"));
 dots.forEach(d=>{if(!d.classList.contains("good"))d.classList.add("dim");d.onclick=null;});
 fb(false,"Resposta em destaque.");syncScore();finishBtns();
}

/* NOMEAR: highlight a spot, name it (choice or type) */
function renderNomear(c){
 if(use3DHorse(state.cat)) return renderNomear3D();
 const idx=Math.floor(Math.random()*c.parts.length);
 const target=c.parts[idx];
 state.q={idx};state.answered=false;
 const toggle=`<div class="toggle" id="nstyle">
    <button data-s="choice" aria-pressed="${state.nameStyle==="choice"}">Alternativas</button>
    <button data-s="type" aria-pressed="${state.nameStyle==="type"}">Digitar</button></div>`;
 let answerUI;
 if(state.nameStyle==="choice"){
   const names=[...new Set(c.parts.map(disp))];
   const opts=shuffle([disp(target),...shuffle(names.filter(n=>n!==disp(target))).slice(0,3)]);
   answerUI=`<div class="choices" id="choices">${opts.map(o=>`<button class="choice" data-name="${o}">${o}</button>`).join("")}</div>`;
 }else{
   answerUI=`<div class="typerow"><input id="ans" placeholder="Digite o nome do ponto…" autocomplete="off" autocapitalize="off"><button class="btn" id="send">Responder</button></div>`;
 }
 app.innerHTML=`
  <div class="prompt">Que parte está destacada? <span class="tag">${c.label}</span></div>
  <div class="stage"><div class="svgbox">${c.draw()}</div></div>
  <div style="display:flex;justify-content:center;margin:2px 0 10px">${toggle}</div>
  ${answerUI}
  <div class="feedback" id="fb">&nbsp;</div>
  <div class="controls"><button class="btn" id="next" style="display:none">Próximo →</button></div>`;
 injectHotspots(c,{active:idx});
 document.getElementById("nstyle").onclick=e=>{const b=e.target.closest("button");if(!b)return;state.nameStyle=b.dataset.s;renderNomear(c);};
 document.getElementById("next").onclick=()=>renderNomear(c);
 if(state.nameStyle==="choice"){
   app.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{
     if(state.answered)return;const chosen=btn.dataset.name;const correct=disp(target);
     state.answered=true;
     app.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.dataset.name===correct)b.classList.add("correct");});
     if(chosen===correct){score.ok++;fb(true,"Correto — "+target.n);}
     else{btn.classList.add("wrong");score.er++;fb(false,"Era: "+target.n);}
     syncScore();finishBtns();
   });
 }else{
   const inp=document.getElementById("ans");inp.focus();
   const go=()=>{if(state.answered)return;const v=inp.value;if(!norm(v))return;
     state.answered=true;const correct=norm(disp(target))||norm(target.n);
     const good=norm(v)===correct||norm(v)===norm(target.n);
     inp.disabled=true;
     if(good){score.ok++;fb(true,"Correto — "+target.n);}
     else{score.er++;fb(false,"Era: "+target.n+" (você escreveu “"+v+"”)");}
     syncScore();finishBtns();};
   document.getElementById("send").onclick=go;
   inp.onkeydown=e=>{if(e.key==="Enter")go();};
 }
}

/* APONTAR 3D: dado o nome, clicar no ponto no modelo */
function renderApontar3D(){
 app.innerHTML=`
  <div class="prompt" id="apprompt">Onde fica: <b>…</b>?</div>
  <div class="h3dbox" id="apbox"><div class="h3d-load">Carregando modelo 3D…</div></div>
  <p class="h3d-hint">Arraste para girar · clique no ponto certo</p>
  <div class="feedback" id="fb">&nbsp;</div>
  <div class="controls"><button class="btn ghost" id="skip">Mostrar resposta</button><button class="btn" id="next" style="display:none">Próximo →</button></div>`;
 const parts=Horse3D.parts();
 let accept=[], answered=true;
 const box=document.getElementById("apbox");
 function nextQ(){
   answered=false;
   const idx=Math.floor(Math.random()*parts.length);
   accept=parts.map((p,i)=>disp(p)===disp(parts[idx])?i:-1).filter(i=>i>=0);
   document.getElementById("apprompt").innerHTML=`Onde fica: <b>${parts[idx].n}</b>?`;
   document.getElementById("fb").innerHTML="&nbsp;";
   document.getElementById("next").style.display="none";
   document.getElementById("skip").style.display="";
   Horse3D.clearMarks(); Horse3D.setLabels("dot");
 }
 function finish(){document.getElementById("next").style.display="";document.getElementById("skip").style.display="none";}
 function onPick(i){
   if(answered)return; answered=true;
   if(accept.includes(i)){Horse3D.mark(i,"good");score.ok++;fb(true,"Correto!");}
   else{Horse3D.mark(i,"bad");accept.forEach(k=>Horse3D.mark(k,"good"));score.er++;fb(false,"Esse é: "+parts[i].n+" — o certo está em verde.");}
   syncScore(); finish();
 }
 document.getElementById("skip").onclick=()=>{if(answered)return;answered=true;accept.forEach(k=>Horse3D.mark(k,"good"));score.er++;fb(false,"Resposta em verde.");syncScore();finish();};
 document.getElementById("next").onclick=nextQ;
 window.__h3dReady=()=>{const l=box.querySelector(".h3d-load");if(l)l.remove();nextQ();};
 Horse3D.init(box,{model:HORSE_MODEL_URL,onPick,onError:()=>{box.innerHTML='<div class="h3d-load">Não foi possível carregar o modelo 3D.</div>';}});
}

/* NOMEAR 3D: destaca um ponto, nomear (alternativas ou digitar) */
function renderNomear3D(){
 const toggle=`<div class="toggle" id="nstyle"><button data-s="choice" aria-pressed="${state.nameStyle==="choice"}">Alternativas</button><button data-s="type" aria-pressed="${state.nameStyle==="type"}">Digitar</button></div>`;
 app.innerHTML=`
  <div class="prompt">Que parte está destacada? <span class="tag">Partes do Cavalo</span></div>
  <div class="h3dbox" id="nmbox"><div class="h3d-load">Carregando modelo 3D…</div></div>
  <div style="display:flex;justify-content:center;margin:8px 0 10px">${toggle}</div>
  <div id="nmui"></div>
  <div class="feedback" id="fb">&nbsp;</div>
  <div class="controls"><button class="btn" id="next" style="display:none">Próximo →</button></div>`;
 const parts=Horse3D.parts();
 let cur=0, answered=true;
 const box=document.getElementById("nmbox");
 document.getElementById("nstyle").onclick=e=>{const b=e.target.closest("button");if(!b)return;state.nameStyle=b.dataset.s;[...b.parentNode.children].forEach(x=>x.setAttribute("aria-pressed",x===b));if(!answered)buildAnswer();};
 document.getElementById("next").onclick=nextQ;
 function done(){document.getElementById("next").style.display="";}
 function nextQ(){
   answered=false;
   cur=Math.floor(Math.random()*parts.length);
   Horse3D.clearMarks(); Horse3D.showOnly(cur); Horse3D.stopAuto();
   document.getElementById("fb").innerHTML="&nbsp;";
   document.getElementById("next").style.display="none";
   buildAnswer();
 }
 function buildAnswer(){
   const ui=document.getElementById("nmui"), target=parts[cur], correct=disp(target);
   if(state.nameStyle==="choice"){
     const names=[...new Set(parts.map(disp))];
     const opts=shuffle([correct,...shuffle(names.filter(n=>n!==correct)).slice(0,3)]);
     ui.innerHTML=`<div class="choices">${opts.map(o=>`<button class="choice" data-name="${o}">${o}</button>`).join("")}</div>`;
     ui.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{
       if(answered)return; answered=true;
       ui.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.dataset.name===correct)b.classList.add("correct");});
       if(btn.dataset.name===correct){score.ok++;Horse3D.mark(cur,"good");fb(true,"Correto — "+target.n);}
       else{btn.classList.add("wrong");score.er++;Horse3D.mark(cur,"bad");fb(false,"Era: "+target.n);}
       syncScore(); done();
     });
   }else{
     ui.innerHTML=`<div class="typerow"><input id="ans" placeholder="Digite o nome do ponto…" autocomplete="off" autocapitalize="off"><button class="btn" id="send">Responder</button></div>`;
     const inp=document.getElementById("ans"); inp.focus();
     const go=()=>{if(answered)return;const v=inp.value;if(!norm(v))return;answered=true;
       const correctN=norm(correct)||norm(target.n), good=norm(v)===correctN||norm(v)===norm(target.n);
       inp.disabled=true;
       if(good){score.ok++;Horse3D.mark(cur,"good");fb(true,"Correto — "+target.n);}
       else{score.er++;Horse3D.mark(cur,"bad");fb(false,"Era: "+target.n+" (você escreveu “"+v+"”)");}
       syncScore(); done();};
     document.getElementById("send").onclick=go; inp.onkeydown=e=>{if(e.key==="Enter")go();};
   }
 }
 window.__h3dReady=()=>{const l=box.querySelector(".h3d-load");if(l)l.remove();nextQ();};
 Horse3D.init(box,{model:HORSE_MODEL_URL,onError:()=>{box.innerHTML='<div class="h3d-load">Não foi possível carregar o modelo 3D.</div>';}});
}

   <div class="cards">${materiais.filter(m=>m.g===g).map(m=>`<div class="card"><h3>${m.n}</h3><p>${m.d}</p></div>`).join("")}</div>`).join("");
}
function renderMatQuiz(){
 const target=rnd(materiais);state.answered=false;
 const opts=shuffle([target.n,...shuffle(materiais.filter(m=>m.n!==target.n)).slice(0,3).map(m=>m.n)]);
 app.innerHTML=`
  <div class="prompt" style="max-width:620px;margin:6px auto 14px">“${target.d}”</div>
  <div class="choices">${opts.map(o=>`<button class="choice" data-name="${o}">${o}</button>`).join("")}</div>
  <div class="feedback" id="fb">&nbsp;</div>
  <div class="controls"><button class="btn" id="next" style="display:none">Próximo →</button></div>`;
 document.getElementById("next").onclick=renderMatQuiz;
 app.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{
   if(state.answered)return;state.answered=true;
   app.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.dataset.name===target.n)b.classList.add("correct");});
   if(btn.dataset.name===target.n){score.ok++;fb(true,"Correto!");}
   else{btn.classList.add("wrong");score.er++;fb(false,"Era: "+target.n);}
   syncScore();finishBtns();
 });
}

/* ---------- MODO PROVA ---------- */
let exam=null, examTimer=null;
function clearExamTimer(){if(examTimer){clearInterval(examTimer);examTimer=null;}}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+":"+String(ss).padStart(2,"0");}

function renderProva(){
 if(!exam||exam.phase==="setup")return renderProvaSetup();
 if(exam.phase==="run")return renderProvaQuestion();
 if(exam.phase==="done")return renderProvaResults();
}

function renderProvaSetup(){
 clearExamTimer();if(window.Horse3D&&Horse3D.isReady())Horse3D.dispose();exam={phase:"setup"};
 const catOpts=[["cavalo","Partes do Cavalo",cavaloParts.length],["sela","Sela",selaParts.length],
   ["bridao","Cabeçada de Bridão",bridaoParts.length],["materiais","Materiais",materiais.length]];
 app.innerHTML=`
  <div class="prompt"><b>Modo Prova</b><span class="tag">cronometrada</span></div>
  <div class="setup">
    <div class="field"><label>Conteúdo da prova</label>
      <div class="checkrow">${catOpts.map(([k,l,n])=>`<label class="chk"><input type="checkbox" value="${k}" checked> ${l} <em>${n}</em></label>`).join("")}</div>
    </div>
    <div class="field"><label>Formato das respostas</label>
      <div class="seg" id="fmt"><button data-v="alt" aria-pressed="true">Alternativas</button><button data-v="dis" aria-pressed="false">Dissertativa</button><button data-v="mix" aria-pressed="false">Mista</button></div>
      <p class="note" id="fmtnote">Escolha a alternativa correta — correção automática.</p>
    </div>
    <div class="field"><label>Nº de questões</label>
      <div class="seg" id="qty"><button data-v="10" aria-pressed="true">10</button><button data-v="20" aria-pressed="false">20</button><button data-v="0" aria-pressed="false">Todas</button></div>
    </div>
    <div class="field"><label>Tempo</label>
      <div class="seg" id="tmr"><button data-v="0" aria-pressed="true">Sem limite</button><button data-v="300" aria-pressed="false">5 min</button><button data-v="600" aria-pressed="false">10 min</button></div>
    </div>
    <button class="btn start" id="start">Iniciar prova →</button>
  </div>`;
 const cfg={fmt:"alt",qty:"10",tmr:"0"};
 function seg(id,key,cb){const el=document.getElementById(id);el.onclick=e=>{const b=e.target.closest("button");if(!b)return;[...el.children].forEach(x=>x.setAttribute("aria-pressed",x===b));cfg[key]=b.dataset.v;cb&&cb(b.dataset.v);};}
 seg("fmt","fmt",v=>{document.getElementById("fmtnote").textContent=
   v==="alt"?"Escolha a alternativa correta — correção automática."
   :v==="dis"?"Escreva o nome e explique o que é a parte; você confere pelo gabarito e se avalia."
   :"Mistura questões de alternativa e dissertativas.";});
 seg("qty","qty");seg("tmr","tmr");
 document.getElementById("start").onclick=()=>{
   const cats=[...app.querySelectorAll(".checkrow input:checked")].map(i=>i.value);
   if(!cats.length){alert("Selecione ao menos um conteúdo.");return;}
   startProva(cats,cfg.fmt,parseInt(cfg.qty),parseInt(cfg.tmr));
 };
}

function use3DHorse(cat){return cat==="cavalo"&&window.ENABLE_3D&&window.Horse3D;}
function provaParts(cat){return use3DHorse(cat)?Horse3D.parts():CATS[cat].parts;}
function buildPool(cats){
 const pool=[];
 cats.forEach(cat=>{
   if(cat==="materiais")materiais.forEach((m,idx)=>pool.push({cat,idx}));
   else provaParts(cat).forEach((p,idx)=>pool.push({cat,idx}));
 });
 return pool;
}
function makeQuestions(items,fmt){
 return items.map(it=>({...it,format:fmt==="mix"?(Math.random()<.5?"alt":"dis"):fmt,result:null,given:null}));
}
function startProva(cats,fmt,qty,limit){
 let items=shuffle(buildPool(cats));
 if(qty>0)items=items.slice(0,qty);
 exam={phase:"run",cats,fmt,qs:makeQuestions(items,fmt),i:0,limit,t0:Date.now(),elapsed:0};
 clearExamTimer();examTimer=setInterval(tickExam,1000);
 renderProvaQuestion();
}
function tickExam(){
 if(!exam||exam.phase!=="run"){clearExamTimer();return;}
 exam.elapsed=Math.floor((Date.now()-exam.t0)/1000);
 const el=document.getElementById("examTime");
 if(el){const remain=exam.limit?Math.max(0,exam.limit-exam.elapsed):exam.elapsed;
   el.textContent=fmtTime(remain);if(exam.limit&&remain<=0)finishProva();}
}
function examItemData(q){
 if(q.cat==="materiais"){const m=materiais[q.idx];return{name:m.n,full:m.n,def:m.d,mat:m};}
 const p=provaParts(q.cat)[q.idx];return{name:disp(p),full:p.n,def:DEFS[p.n]||"",part:p};
}
function examDiagramSVG(cat,part){
 const {R}=markerSize(CATS[cat].vb);
 const marker=`<g class="hs pulse" style="--r:${R}px;pointer-events:none"><circle class="ring" cx="${part.x}" cy="${part.y}" r="${R}"/><circle class="dot" cx="${part.x}" cy="${part.y}" r="${R}"/></g>`;
 return CATS[cat].draw().replace("</svg>",marker+"</svg>");
}
function renderProvaQuestion(){
 const q=exam.qs[exam.i],d=examItemData(q),total=exam.qs.length;
 const use3D=use3DHorse(q.cat);
 if(!use3D&&window.Horse3D&&Horse3D.isReady()) Horse3D.dispose();
 let stim,question;
 if(q.cat==="materiais"){
   stim=q.format==="alt"?`<div class="stim card"><p>${d.def}</p></div>`:`<div class="stim card"><h3>${d.name}</h3></div>`;
   question=q.format==="alt"?"Que material é este?":"Explique: o que é este material?";
 }else if(use3D){
   stim=`<div class="h3dbox" id="provah"><div class="h3d-load">Carregando modelo 3D…</div></div>`;
   question=q.format==="alt"?"Que parte está destacada? (gire o modelo se precisar)":"Identifique e explique a parte destacada.";
 }else{
   stim=`<div class="svgbox">${examDiagramSVG(q.cat,d.part)}</div>`;
   question=q.format==="alt"?"Que parte está destacada?":"Identifique e explique a parte destacada.";
 }
 let answerUI;
 if(q.format==="alt"){
   const names=q.cat==="materiais"?[...new Set(materiais.map(m=>m.n))]:[...new Set(provaParts(q.cat).map(disp))];
   const opts=shuffle([d.name,...shuffle(names.filter(n=>n!==d.name)).slice(0,3)]);
   answerUI=`<div class="choices" id="choices">${opts.map(o=>`<button class="choice" data-name="${o}">${o}</button>`).join("")}</div>`;
 }else{
   answerUI=`<textarea id="diss" class="textarea" rows="3" placeholder="Escreva o nome e explique o que é…"></textarea>
     <div class="controls"><button class="btn" id="reveal">Ver gabarito</button></div><div id="gab"></div>`;
 }
 const tagLabel=q.cat==="materiais"?"Material":CATS[q.cat].label;
 app.innerHTML=`
  <div class="qtop">
    <div class="prog"><span>Questão ${exam.i+1} de ${total}</span><div class="pbar"><i style="width:${exam.i/total*100}%"></i></div></div>
    <div class="clock ${exam.limit?"lim":""}">⏱ <b id="examTime">${fmtTime(exam.limit?Math.max(0,exam.limit-exam.elapsed):exam.elapsed)}</b></div>
  </div>
  <div class="prompt" style="margin-top:8px">${question}<span class="tag">${tagLabel}</span></div>
  <div class="stage">${stim}</div>
  ${answerUI}
  <div class="feedback" id="fb">&nbsp;</div>
  <div class="controls" id="navc"></div>`;
 if(use3D){
   const box=document.getElementById("provah");
   window.__h3dReady=()=>{const l=box.querySelector(".h3d-load");if(l)l.remove();Horse3D.setLabels("hide");Horse3D.showOnly(q.idx);Horse3D.stopAuto();};
   Horse3D.init(box,{model:HORSE_MODEL_URL,onError:()=>{box.innerHTML='<div class="h3d-load">Não foi possível carregar o modelo 3D.</div>';}});
 }
 function showNav(){
   const nav=document.getElementById("navc");
   nav.innerHTML=`<button class="btn" id="nx">${exam.i<total-1?"Próxima →":"Finalizar prova ✓"}</button>`;
   document.getElementById("nx").onclick=()=>{if(exam.i<total-1){exam.i++;renderProvaQuestion();}else finishProva();};
 }
 if(q.format==="alt"){
   app.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{
     if(q.result!==null)return;
     app.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.dataset.name===d.name)b.classList.add("correct");});
     if(btn.dataset.name===d.name){q.result=1;fb(true,"Correto!");}
     else{btn.classList.add("wrong");q.result=0;fb(false,"Correto: "+d.full);}
     showNav();
   });
 }else{
   document.getElementById("reveal").onclick=()=>{
     if(document.getElementById("gab").innerHTML)return;
     q.given=document.getElementById("diss").value;
     document.getElementById("gab").innerHTML=`
       <div class="gabarito"><span class="glabel">Gabarito</span><strong>${d.full}</strong>${d.def?" — "+d.def:""}</div>
       <p class="selfq">Como você foi nesta questão?</p>
       <div class="selfgrade"><button data-s="1" class="sg ok">Acertei</button><button data-s="0.5" class="sg partial">Parcial</button><button data-s="0" class="sg err">Errei</button></div>`;
     document.getElementById("reveal").style.display="none";
     document.querySelector(".selfgrade").onclick=e=>{const b=e.target.closest(".sg");if(!b)return;
       q.result=parseFloat(b.dataset.s);
       document.querySelectorAll(".sg").forEach(x=>{x.disabled=true;x.classList.toggle("chosen",x===b);});
       showNav();};
   };
 }
}
function finishProva(){
 if(window.Horse3D&&Horse3D.isReady()) Horse3D.dispose();
 clearExamTimer();exam.phase="done";exam.elapsed=Math.floor((Date.now()-exam.t0)/1000);
 renderProvaResults();
}
function renderProvaResults(){
 const qs=exam.qs,total=qs.length;
 const pts=qs.reduce((a,q)=>a+(q.result||0),0);
 const pct=Math.round(pts/total*100),nota=pts/total*10;
 const review=qs.map((q,i)=>{const d=examItemData(q);
   const mark=q.result===1?"✓":q.result===0.5?"~":"✗";
   const cls=q.result===1?"ok":q.result===0.5?"partial":"err";
   return `<li class="rv ${cls}"><span class="rvn">${i+1}</span><span class="rvm">${mark}</span><span class="rvt">${d.full}</span></li>`;}).join("");
 app.innerHTML=`
   <div class="results">
     <div class="prompt"><b>Resultado da Prova</b></div>
     <div class="scorecard">
       <div class="nota"><span class="big">${nota.toFixed(1)}</span><span class="of">/ 10</span></div>
       <div class="rmeta">
         <div><b>${pct}%</b><span>aproveitamento</span></div>
         <div><b>${pts.toFixed(1)}/${total}</b><span>pontos</span></div>
         <div><b>${fmtTime(exam.elapsed)}</b><span>tempo</span></div>
       </div>
     </div>
     <ol class="review">${review}</ol>
     <div class="controls">
       <button class="btn" id="again">Nova prova</button>
       <button class="btn ghost" id="redo">Refazer igual</button>
     </div>
   </div>`;
 document.getElementById("again").onclick=()=>{exam=null;renderProvaSetup();};
 document.getElementById("redo").onclick=()=>{
   const cats=exam.cats,fmt=exam.fmt,limit=exam.limit;
   const items=exam.qs.map(q=>({cat:q.cat,idx:q.idx}));
   exam={phase:"run",cats,fmt,qs:makeQuestions(shuffle(items),fmt),i:0,limit,t0:Date.now(),elapsed:0};
   clearExamTimer();examTimer=setInterval(tickExam,1000);renderProvaQuestion();
 };
}

/* ---------- helpers ---------- */
function injectHotspots(c,opts){
 const box=app.querySelector(".svgbox svg.diagram");
 box.insertAdjacentHTML("beforeend",hotspotsSVG(c,opts));
}
function fb(ok,msg){const f=document.getElementById("fb");if(!f)return;f.textContent=msg;f.className="feedback "+(ok?"ok":"er");}
function finishBtns(){const n=document.getElementById("next");if(n)n.style.display="";const s=document.getElementById("skip");if(s)s.style.display="none";}
function syncScore(){document.getElementById("sOk").textContent=score.ok;document.getElementById("sEr").textContent=score.er;}
document.getElementById("reset").onclick=()=>{score.ok=0;score.er=0;syncScore();};

/* theme */
const themeBtn=document.getElementById("theme");
themeBtn.onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");
 const next=cur==="dark"?"light":cur==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");
 document.documentElement.setAttribute("data-theme",next);};

/* init */
buildTabs();buildModes();render();
</script>
</body>
</html>
