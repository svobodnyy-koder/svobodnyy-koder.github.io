<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicoLúdico: O Jogo das Placas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9f0e9;
    --paper:#fbfbf4;
    --ink:#1c2b24;
    --ink-dim:#54685d;
    --teal:#1f7f72;
    --teal-deep:#145f56;
    --coral:#d6512f;
    --gold:#c8932a;
    --agar:#f4efdb;
    --line:rgba(28,43,36,0.12);
    --radius:20px;
    --display:"Fraunces", serif;
    --body:"Space Grotesk", sans-serif;
    --mono:"IBM Plex Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(31,127,114,0.10), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(200,147,42,0.12), transparent 45%);
    color:var(--ink);
    font-family:var(--body);
    display:flex;flex-direction:column;
    min-height:100vh;
  }
  ::selection{background:var(--teal);color:var(--paper);}
  a{color:var(--teal-deep);}

  .credit-strip{
    text-align:center;padding:.6rem 1rem;
    font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;
    background:var(--ink);color:var(--agar);
  }
  .credit-strip b{color:#fff;font-weight:600;}

  main.stage{
    flex:1;display:flex;flex-direction:column;align-items:center;
    padding:2.2rem 1.25rem 1rem;
  }

  .titlebar{text-align:center;max-width:560px;margin-bottom:1.6rem;}
  .eyebrow{
    font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold);display:flex;align-items:center;justify-content:center;gap:.6em;margin-bottom:.6rem;
  }
  .eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:var(--gold);display:inline-block;}
  h1{
    font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,7vw,3.4rem);
    margin:0 0 .4rem;letter-spacing:-.01em;color:var(--teal-deep);
  }
  h1 em{font-style:italic;color:var(--coral);font-weight:500;}
  .titlebar p{color:var(--ink-dim);margin:0;font-size:1rem;}

  .board{width:100%;max-width:900px;display:flex;flex-direction:column;gap:1.4rem;align-items:center;}

  .clue-card{
    width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:1.4rem 1.7rem;box-shadow:0 8px 24px rgba(28,43,36,.06);
    display:flex;flex-direction:column;gap:.5rem;
  }
  .clue-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;}
  .clue-label{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-deep);}
  .hud{display:flex;gap:1.2rem;font-family:var(--mono);font-size:.78rem;color:var(--ink-dim);}
  .hud b{color:var(--coral);}
  .clue-text{font-family:var(--display);font-size:1.25rem;line-height:1.35;margin:.3rem 0 0;color:var(--ink);}

  .dishes{
    display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem;width:100%;
  }
  @media (max-width:640px){ .dishes{grid-template-columns:repeat(2,1fr);gap:.7rem;} }
  @media (max-width:400px){ .dish .latin{display:none;} }

  .dish{
    position:relative;aspect-ratio:1/1;border-radius:50%;cursor:pointer;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.9), transparent 45%),
      radial-gradient(circle at center, var(--agar) 0%, var(--agar) 62%, #e3dcbd 63%, #e3dcbd 68%, transparent 69%);
    border:3px solid #d9d2ab;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:.9rem;transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    box-shadow:0 6px 16px rgba(28,43,36,.08), inset 0 0 0 6px rgba(255,255,255,.35);
  }
  .dish:hover{transform:translateY(-4px);}
  .dish .glyph{font-size:1.7rem;margin-bottom:.25rem;transition:transform .3s ease;}
  .dish .name{font-family:var(--body);font-weight:600;font-size:.72rem;color:var(--ink);line-height:1.2;}
  .dish .latin{font-family:var(--mono);font-style:italic;font-size:.56rem;color:var(--ink-dim);margin-top:.1rem;line-height:1.2;}

  .dish.solved{
    border-color:var(--teal);
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.9), transparent 45%),
      radial-gradient(circle at center, #d7f2e8 0%, #d7f2e8 62%, var(--teal) 63%, var(--teal) 68%, transparent 69%);
    cursor:default;
  }
  .dish.solved::after{
    content:"✓";position:absolute;top:8px;right:14px;color:var(--teal-deep);font-weight:700;font-size:1rem;
  }
  .dish.solved .glyph{transform:scale(1.15);}
  .dish.wrong{animation:shake .4s ease; border-color:var(--coral);}
  .dish.wrong .glyph{filter:grayscale(.2);}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }
  .dish.locked{opacity:.55;pointer-events:none;}

  .fact-strip{
    width:100%;min-height:2.6rem;
    font-family:var(--mono);font-size:.82rem;color:var(--teal-deep);
    text-align:center;transition:opacity .3s ease;
  }

  /* ---------- microscope reveal ---------- */
  .scope-overlay{
    position:fixed;inset:0;z-index:60;
    background:rgba(20,31,26,0.55);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:1.2rem;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .scope-overlay.show{opacity:1;pointer-events:auto;}
  .scope-card{
    width:100%;max-width:420px;background:var(--paper);border-radius:24px;
    padding:1.8rem 1.8rem 1.6rem;text-align:center;
    box-shadow:0 24px 60px rgba(20,31,26,.35);
    transform:scale(.9) translateY(10px);transition:transform .35s cubic-bezier(.2,.9,.2,1);
  }
  .scope-overlay.show .scope-card{transform:scale(1) translateY(0);}
  .scope-tag{
    font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--teal-deep);margin-bottom:.9rem;display:flex;align-items:center;justify-content:center;gap:.5em;
  }
  .scope-viewport{
    position:relative;width:210px;height:210px;margin:0 auto 1.1rem;border-radius:50%;
    background:#0c0c0c;
    border:8px solid var(--ink);
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.15),
      0 10px 24px rgba(20,31,26,.2);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .scope-viewport::before,.scope-viewport::after{
    content:"";position:absolute;background:rgba(255,255,255,.35);z-index:3;
  }
  .scope-viewport::before{width:100%;height:1px;top:50%;left:0;}
  .scope-viewport::after{height:100%;width:1px;left:50%;top:0;}
  .scope-viewport img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1;filter:contrast(1.05) saturate(1.05);}
  .scope-name{font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--teal-deep);margin-bottom:.15rem;}
  .scope-latin{font-family:var(--mono);font-style:italic;font-size:.78rem;color:var(--ink-dim);margin-bottom:.9rem;}
  .scope-fact{font-family:var(--body);font-size:.98rem;color:var(--ink);line-height:1.5;margin-bottom:1.5rem;}
  .scope-progress{
    font-family:var(--mono);font-size:.72rem;color:var(--ink-dim);margin-bottom:1rem;letter-spacing:.05em;
  }

  .final-panel{
    width:100%;max-width:520px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:2.2rem;text-align:center;box-shadow:0 10px 30px rgba(28,43,36,.08);
  }
  .final-panel .tag{font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);}
  .final-panel .rank{font-family:var(--display);font-size:1.8rem;color:var(--teal-deep);margin:.4rem 0;}
  .final-panel .score{font-family:var(--mono);color:var(--ink-dim);margin-bottom:1.2rem;}

  .btn{
    font-family:var(--body);font-weight:600;font-size:.92rem;
    padding:.8em 1.6em;border-radius:999px;border:1px solid var(--teal-deep);
    background:var(--teal-deep);color:#fff;cursor:pointer;
    display:inline-flex;align-items:center;gap:.5em;transition:transform .2s ease, background .2s ease;
  }
  .btn:hover{transform:translateY(-2px);background:var(--teal);}
  .btn.ghost{background:transparent;color:var(--teal-deep);}
  .btn.ghost:hover{background:rgba(31,127,114,0.08);}


</style>
</head>
<body>

<div class="credit-strip">Criado por <b>Ana Claudia Resende</b>, para o Laboratório de Micologia · FAMED / FURG</div>

<main class="stage">
  <div class="titlebar">
    <div class="eyebrow">Jogo das Placas</div>
    <h1>MICO<em>LÚDICO</em></h1>
    <p>Leia a pista clínica e toque na placa de Petri que combina com ela.</p>
  </div>

  <div class="board">
    <div class="clue-card">
      <div class="clue-top">
        <span class="clue-label">Pista <span id="roundNum">1</span> de <span id="roundTotal">6</span></span>
        <div class="hud"><span>Tentativas: <b id="triesVal">0</b></span></div>
      </div>
      <p class="clue-text" id="clueText">Carregando pista...</p>
    </div>

    <div class="dishes" id="dishesGrid"></div>

    <div class="fact-strip" id="factStrip"></div>
  </div>

  <div class="final-panel" id="finalPanel" hidden>
    <div class="tag">Placar final</div>
    <div class="rank" id="finalRank"></div>
    <div class="score" id="finalScore"></div>
    <button class="btn" id="playAgainBtn">↺ Jogar novamente</button>
  </div>
</main>

<div class="scope-overlay" id="scopeOverlay">
  <div class="scope-card">
    <div class="scope-tag">🔬 Achado no microscópio</div>
    <div class="scope-viewport">
      <img id="scopeDrawing" src="" alt="">
    </div>
    <div class="scope-name" id="scopeName"></div>
    <div class="scope-latin" id="scopeLatin"></div>
    <div class="scope-fact" id="scopeFact"></div>
    <div class="scope-progress" id="scopeProgress"></div>
    <button class="btn" id="scopeContinueBtn">Continuar a caçada 🍄</button>
  </div>
</div>

<script>
const phyla = [
  {id:1, glyph:"🦶", name:"Dermatófitos", latin:"Trichophyton, Microsporum, Epidermophyton",
   clue:"Adoro viver na queratina da pele, das unhas e dos cabelos. Você me conhece popularmente pelo nome das 'tinhas'.",
   fact:"Dermatófitos: fungos filamentosos que digerem queratina, causando as micoses superficiais conhecidas como tinhas."},
  {id:2, glyph:"🧫", name:"Candida albicans", latin:"Candida albicans",
   clue:"Vivo normalmente no corpo humano sem dar trabalho, mas quando a oportunidade aparece, causo candidíase na boca, na pele ou na vagina.",
   fact:"Candida albicans: levedura que faz parte da microbiota normal, mas pode causar candidíase quando as defesas do hospedeiro caem."},
  {id:3, glyph:"☁️", name:"Cryptococcus neoformans", latin:"Cryptococcus neoformans",
   clue:"Uso uma grossa cápsula como armadura e adoro me esconder em fezes de pombos. Posso causar uma meningite grave.",
   fact:"Cryptococcus neoformans: levedura encapsulada associada a excretas de aves, causadora de meningite criptocócica em pessoas imunossuprimidas."},
  {id:4, glyph:"🌾", name:"Aspergillus spp.", latin:"Aspergillus spp.",
   clue:"Formo uma estrutura parecida com um espanador cheio de esporinhos, e adoro grãos armazenados e ambientes mofados.",
   fact:"Aspergillus: fungo filamentoso muito comum no ambiente, pode causar aspergilose, principalmente em pessoas com imunidade baixa."},
  {id:5, glyph:"⚓", name:"Paracoccidioides brasiliensis", latin:"Paracoccidioides brasiliensis",
   clue:"No microscópio, minhas células-filhas brotam ao redor da célula-mãe formando um desenho parecido com uma roda de leme de navio.",
   fact:"Paracoccidioides brasiliensis: fungo dimórfico endêmico da América Latina, causador da paracoccidioidomicose, com o clássico aspecto em 'roda de leme'."},
  {id:6, glyph:"🐈", name:"Sporothrix schenckii", latin:"Sporothrix schenckii",
   clue:"Costumo entrar pelo corpo através do espinho de uma planta ou da unhada de um gato, e sigo o caminho dos vasos linfáticos pela pele.",
   fact:"Sporothrix schenckii: fungo dimórfico associado à jardinagem e a arranhaduras de gatos, causador da esporotricose."},
  {id:7, glyph:"🍝", name:"Malassezia furfur", latin:"Malassezia furfur",
   clue:"Sou parte normal da pele oleosa, mas às vezes deixo manchas claras ou escuras no tronco, num padrão que lembra espaguete com almôndegas ao microscópio.",
   fact:"Malassezia furfur: levedura lipofílica da pele, relacionada à pitiríase versicolor, com hifas curtas e leveduras arredondadas."},
  {id:8, glyph:"🦇", name:"Histoplasma capsulatum", latin:"Histoplasma capsulatum",
   clue:"Gosto de solos com fezes de morcegos e aves, e quando sou inalado, me escondo dentro das próprias células de defesa do corpo humano.",
   fact:"Histoplasma capsulatum: fungo dimórfico encontrado em cavernas e solos contaminados, causador da histoplasmose, parasita intracelular em macrófagos."},
  {id:9, glyph:"🩹", name:"Mucorales", latin:"Rhizopus, Mucor",
   clue:"Minhas hifas são largas e sem divisórias internas, e eu cresço tão rápido que posso invadir vasos sanguíneos em pacientes bem debilitados.",
   fact:"Mucorales (Rhizopus, Mucor): fungos de crescimento muito rápido, hifas largas e sem septos, causadores da grave mucormicose."},
];

const microDrawings = {
  1: {src:"images/dermatofitos.jpg"}, // Dermatófitos
  2: {src:"images/candida-albicans.jpg"}, // Candida albicans
  3: {src:"images/cryptococcus-neoformans.jpg"}, // Cryptococcus neoformans
  4: {src:"images/aspergillus.jpg"}, // Aspergillus spp.
  5: {src:"images/paracoccidioides-brasiliensis.jpg"}, // Paracoccidioides brasiliensis
  6: {src:"images/sporothrix-schenckii.jpg"}, // Sporothrix schenckii
  7: {src:"images/malassezia-furfur.jpg"}, // Malassezia furfur
  8: {src:"images/histoplasma-capsulatum.jpg"}, // Histoplasma capsulatum
  9: {src:"images/mucorales.jpg"}, // Mucorales
};

let order = [];
let currentRound = 0;
let tries = 0;
let solvedCount = 0;
let locked = false;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildDishes(){
  const grid = document.getElementById('dishesGrid');
  grid.innerHTML = '';
  const shuffledDishes = shuffle(phyla);
  shuffledDishes.forEach(p=>{
    const d = document.createElement('div');
    d.className = 'dish';
    d.dataset.id = p.id;
    d.innerHTML = `<div class="glyph">${p.glyph}</div><div class="name">${p.name}</div><div class="latin">${p.latin}</div>`;
    d.addEventListener('click', ()=> handleGuess(p.id, d));
    grid.appendChild(d);
  });
}

function startGame(){
  order = shuffle(phyla);
  currentRound = 0;
  tries = 0;
  solvedCount = 0;
  locked = false;
  document.getElementById('finalPanel').hidden = true;
  document.querySelector('.board').style.display = 'flex';
  document.getElementById('roundTotal').textContent = phyla.length;
  document.getElementById('triesVal').textContent = 0;
  document.getElementById('factStrip').textContent = '';
  buildDishes();
  nextClue();
}

function nextClue(){
  if(currentRound >= order.length){
    finishGame();
    return;
  }
  document.getElementById('roundNum').textContent = currentRound + 1;
  document.getElementById('clueText').textContent = order[currentRound].clue;
}

function showScope(target){
  const media = microDrawings[target.id];
  const img = document.getElementById('scopeDrawing');
  img.style.display = 'block';
  img.src = media.src;
  img.alt = "Fotomicrografia de " + target.name;
  document.getElementById('scopeName').textContent = target.name;
  document.getElementById('scopeLatin').textContent = target.latin;
  document.getElementById('scopeFact').textContent = target.fact;
  const isLast = currentRound + 1 >= order.length;
  document.getElementById('scopeProgress').textContent = isLast
    ? `Placa ${currentRound + 1} de ${order.length}, a última!`
    : `Placa ${currentRound + 1} de ${order.length} encontrada`;
  document.getElementById('scopeContinueBtn').textContent = isLast ? "Ver meu resultado 🏆" : "Continuar a caçada 🍄";
  document.getElementById('scopeOverlay').classList.add('show');
}

function hideScope(){
  document.getElementById('scopeOverlay').classList.remove('show');
}

document.getElementById('scopeContinueBtn').addEventListener('click', ()=>{
  hideScope();
  currentRound++;
  locked = false;
  nextClue();
});

function handleGuess(id, el){
  if(locked) return;
  if(el.classList.contains('solved')) return;
  const target = order[currentRound];
  tries++;
  document.getElementById('triesVal').textContent = tries;

  if(id === target.id){
    locked = true;
    el.classList.add('solved');
    solvedCount++;
    showScope(target);
  } else {
    el.classList.add('wrong');
    document.getElementById('factStrip').textContent = "Essa não é a placa certa, olhe a pista de novo.";
    setTimeout(()=>{
      el.classList.remove('wrong');
      document.getElementById('factStrip').textContent = '';
    }, 1100);
  }
}

function finishGame(){
  document.querySelector('.board').style.display = 'none';
  const panel = document.getElementById('finalPanel');
  panel.hidden = false;
  let rank = "Estagiário de Bolores";
  if(tries <= phyla.length) rank = "Mestre Micologista 🍄";
  else if(tries <= phyla.length + 3) rank = "Explorador de Micélios";
  else if(tries <= phyla.length + 6) rank = "Curioso do Reino Fungi";
  document.getElementById('finalRank').textContent = rank;
  document.getElementById('finalScore').textContent = `${phyla.length} placas identificadas em ${tries} tentativas`;
}

document.getElementById('playAgainBtn').addEventListener('click', startGame);
startGame();
</script>
</body>
</html>
